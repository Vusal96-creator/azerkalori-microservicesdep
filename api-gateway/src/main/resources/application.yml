server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: lb://AUTH-SERVICE
          predicates: [ "Path=/api/auth/**,/api/billing/**" ]
        - id: catalog
          uri: lb://CATALOG-SERVICE
          predicates: [ "Path=/api/products/**,/graphql/**" ]
        - id: tracking
          uri: lb://TRACKING-SERVICE
          predicates: [ "Path=/api/logs/**,/api/summary/**,/api/chat/**,/ws/**" ]
        - id: nutrition
          uri: lb://NUTRITION-SERVICE
          predicates: [ "Path=/api/goals/**,/api/plans/**" ]

jwt:
  secret: ${JWT_SECRET:local-dev-secret-min-32-chars-long-please}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
