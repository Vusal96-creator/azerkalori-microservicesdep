services:

  postgres:
    image: postgres:16-alpine
    container_name: azerkalori-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

  discovery-server:
    build: ./discovery-server
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx160m"
    ports:
      - "127.0.0.1:8761:8761"

  api-gateway:
    build: ./api-gateway
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m"
      EUREKA_URI: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [discovery-server]

  auth-service:
    build: ./auth-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx224m"
      EUREKA_URI: http://discovery-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=auth
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Stripe (Pro ödəniş) — .env-dən; yoxdursa boş qalır
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-azn}
      STRIPE_PRO_AMOUNT_CENTS: ${STRIPE_PRO_AMOUNT_CENTS:-100}
      APP_URL: ${APP_URL:-http://localhost}
      # SMTP (dəvət məktubu)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-AzerKalori <no-reply@azerkalori.az>}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  catalog-service:
    build: ./catalog-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      EUREKA_URI: http://discovery-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=catalog
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
      redis: { condition: service_started }

  nutrition-service:
    build: ./nutrition-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      EUREKA_URI: http://discovery-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=nutrition
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  tracking-service:
    build: ./tracking-service
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      EUREKA_URI: http://discovery-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=tracking
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on: [api-gateway]

volumes:
  pgdata:
