server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/azerkalori?currentSchema=auth}
    username: ${DB_USER:azer}
    password: ${DB_PASS:secret}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        connecttimeout: 5000
        timeout: 5000
        writetimeout: 5000
app:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:AzərKalori <no-reply@azerkalori.az>}
    app-url: ${APP_URL:http://localhost}
jwt:
  secret: ${JWT_SECRET:local-dev-secret-min-32-chars-long-please}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
