# Droplet-də RAG chatbot üçün AI stack — n8n + Qdrant.
# Ollama YOXDUR (OpenAI işlədilir, yaddaş yüngül qalır).
# Bu, əsas app compose-undan AYRIDIR — lokal n8n-inə heç bir təsiri yoxdur.
#
# İşə sal:   docker compose -f docker-compose.ai.yml up -d
# Dayandır:  docker compose -f docker-compose.ai.yml down
services:
  qdrant:
    image: qdrant/qdrant
    container_name: azerkalori-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: azerkalori-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"      # yalnız lokal — Caddy subdomen ilə açır
    environment:
      - N8N_HOST=n8n.kalorikolik.xyz
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.kalorikolik.xyz/
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/shared
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/data/shared        # bilik faylı burada (azerkalori-knowledge.txt)

volumes:
  qdrant_data:
  n8n_data:
