# AzərKalori RAG AI stack — əsas azerkalori sistemindən AYRI işləyir.
# Qaldırmaq:   docker compose -f docker-compose.ai.yml --profile cpu up -d
# Dayandırmaq: docker compose -f docker-compose.ai.yml --profile cpu down
#
# Qeyd: bu stack 5678/6333/11434 portlarını istifadə edir. Əgər sənin
# self-hosted-ai-starter-kit onsuz da işləyirsə, əvvəlcə onu dayandır ki,
# port konflikti olmasın (və ya bu faylı işlətməyib mövcud olanı istifadə et).

volumes:
  azk_n8n_storage:
  azk_qdrant_storage:
  azk_ollama_storage:

networks:
  azk-ai:

services:
  qdrant:
    image: qdrant/qdrant
    container_name: azk-qdrant
    networks: ['azk-ai']
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - azk_qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: azk-ollama
    networks: ['azk-ai']
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - azk_ollama_storage:/root/.ollama

  # Bir dəfəlik: embedding modelini (nomic-embed-text) yükləyir, sonra çıxır.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: azk-ollama-pull
    networks: ['azk-ai']
    volumes:
      - azk_ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - "sleep 3; ollama pull nomic-embed-text"
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n:latest
    container_name: azk-n8n
    networks: ['azk-ai']
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Frontend (localhost) chatbot-un webhook-a çıxışı üçün CORS icazəsi:
      - N8N_CORS_ALLOW_ORIGIN=*
      # Disk-dən fayl oxumağa icazə (bilik bazası /data/shared):
      - N8N_RESTRICT_FILE_ACCESS_TO=
      - OLLAMA_HOST=ollama:11434
    volumes:
      - azk_n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
      - ./n8n:/demo-data:ro
    depends_on:
      - qdrant
      - ollama
